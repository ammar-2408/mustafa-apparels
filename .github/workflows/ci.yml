# CI for the dress-shop monorepo.
# Template: script names match AGENTS.md §3. Claude Code adapts this in plan step 0.9.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: test
  INTEGRATIONS_MODE: mock # email/images/rate-limit use in-memory fakes
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  WEB_URL: http://localhost:3000
  ADMIN_URL: http://localhost:3001
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
  REVALIDATE_SECRET: ci-only-revalidate-secret-0000000000000000
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-cloud
  CLOUDINARY_API_KEY: ci
  CLOUDINARY_API_SECRET: ci
  RESEND_API_KEY: ci
  EMAIL_FROM: CI <ci@example.com>
  SHOP_INBOX_EMAIL: shop@example.com
  UPSTASH_REDIS_REST_URL: http://localhost:0
  UPSTASH_REDIS_REST_TOKEN: ci
  SEED_ADMIN_EMAIL: admin@example.com
  SEED_ADMIN_PASSWORD: ci-Admin-Password-123!
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop_test
  DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shop_test

jobs:
  quality:
    name: Lint, typecheck, unit + integration, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test # every package's test script already measures coverage
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 7

  e2e:
    name: E2E, responsive, SEO, a11y, security (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm db:migrate
      - run: pnpm db:seed -- --e2e
      - run: pnpm build
      - run: pnpm test:e2e # Playwright webServer starts web (3000) + admin (3001)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    if: github.event_name == 'pull_request'
    needs: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed -- --e2e
      - run: pnpm build
      - run: pnpm dlx @lhci/cli autorun # reads .lighthouserc.json (budgets: perf ≥ 0.9, a11y ≥ 0.95, seo = 1)
